---
name: Build and push Docker image

on:
  push:
    tags:
      - v[0-9]+.[0-9]+.[0-9]+
    branches:
      - main
  pull_request:
    branches:
      - main

permissions:
  contents: read # principle of least privilege

jobs:
  build:
    name: Build and push Docker image
    runs-on: ubuntu-24.04
    steps:
      - name: Checkout repository
        uses: actions/checkout@v7
        with:
          fetch-depth: 0
      - name: Set up Docker Buildx for multi-platform builds
        uses: docker/setup-buildx-action@v4
        with:
          platforms: ${{ vars.PLATFORMS }}
      - name: Log in to Docker Hub
        if: github.event_name != 'pull_request'
        uses: docker/login-action@v4
        with:
          username: ${{ secrets.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}
      - name: Derive image tag(s)
        uses: docker/metadata-action@v6
        with:
          images: |
            powerdns/lightningstream
          tags: |
            type=ref,event=branch
            type=ref,event=pr
            type=semver,pattern={{version}}
      - name: Build and push Docker image
        uses: docker/build-push-action@v7
        with:
          platforms: ${{ vars.PLATFORMS }}
          push: ${{ github.event_name != 'pull_request' }}
          sbom: true
          tags: ${{ env.DOCKER_METADATA_OUTPUT_TAGS }}
          # Using a normal context instead of the default git-based buildkit
          # context to get all Git information into the build.
          context: .
